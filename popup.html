<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 280px;
      padding: 12px;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    h3 { margin-top: 0; color: #333; }
    .field-group {
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 4px;
      color: #666;
    }
    input {
      width: 100%;
      padding: 6px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      width: 100%;
      padding: 8px;
      background-color: #ff5a00; /* Brave-themed orange */
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover { background-color: #e04f00; }
    #status {
      text-align: center;
      font-size: 11px;
      color: green;
      margin-top: 8px;
      height: 14px;
    }
  </style>
</head>
<body>
  <h3>My Autofill Details</h3>
  
  <div class="field-group">
    <label for="userName">Full Name</label>
    <input type="text" id="userName" placeholder="e.g. John Doe">
  </div>

  <div class="field-group">
    <label for="userEmail">Email Address</label>
    <input type="email" id="userEmail" placeholder="e.g. john@example.com">
  </div>

  <div class="field-group">
    <label for="userPhone">Phone Number</label>
    <input type="text" id="userPhone" placeholder="e.g. +123456789">
  </div>

  <button id="saveBtn">Save Settings</button>
  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
